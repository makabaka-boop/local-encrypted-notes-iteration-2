<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>加密便笺工作台</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #2563eb;
        --danger: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      button {
        padding: 0.4rem 0.9rem;
        border: 1px solid #8884;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      input, textarea {
        padding: 0.5rem;
        border: 1px solid #8886;
        border-radius: 6px;
        font: inherit;
        background: Canvas;
        color: CanvasText;
      }
      .locked {
        max-width: 22rem;
        margin: 12vh auto;
        display: flex;
        flex-direction: column;
      }
      .locked form { display: flex; flex-direction: column; gap: 0.75rem; }
      .restore-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid #8884;
      }
      .restore-panel h2 { margin: 0; font-size: 1.05rem; }
      .hint { color: #666; font-size: 0.85rem; margin: 0; }
      .msg { color: var(--danger); min-height: 1.2em; margin: 0.25rem 0; font-size: 0.9rem; }
      .workbench { display: flex; flex-direction: column; height: 100vh; }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid #8884;
      }
      header .count { color: #666; font-size: 0.9rem; }
      header .spacer { flex: 1; }
      .pw-panel {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #8884;
        flex-wrap: wrap;
      }
      .pw-panel[hidden] { display: none; }
      .banner {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem 1rem;
        background: #fef3c7;
        color: #92400e;
      }
      .banner[hidden] { display: none; }
      .body { flex: 1; display: flex; min-height: 0; }
      aside {
        width: 15rem;
        border-right: 1px solid #8884;
        overflow-y: auto;
      }
      .note-list { list-style: none; margin: 0; padding: 0; }
      .note-list li {
        padding: 0.6rem 1rem;
        cursor: pointer;
        border-bottom: 1px solid #8882;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note-list li:hover { background: #8881; }
      .note-list li.active { background: #2563eb22; }
      .editor { flex: 1; display: flex; flex-direction: column; padding: 0.75rem; gap: 0.5rem; }
      .editor textarea { flex: 1; resize: none; }
      .editor-bar { display: flex; gap: 0.5rem; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
